<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | MAVI Jewelry</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <a href="index.html" class="brand-logo">MAVI</a>
    <nav>
      <a href="index.html">Collection</a>
      <a href="sale.html" class="sale-link">Archive Sale</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="cart-btn" id="openCart">
      Cart <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <main>
    <section class="hero">
      <span class="hero-subtitle">Get in Touch</span>
      <h1 class="hero-title">We are here to assist you</h1>
    </section>

    <section class="content-section">
      <div class="contact-container">
        <form onsubmit="event.preventDefault(); alert('Thank you for your message. We will respond within 24 hours.');">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Jane Doe">
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="jane@example.com">
          </div>
          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" rows="5" required placeholder="How can we help you?"></textarea>
          </div>
          <button type="submit" class="btn-submit">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-brand">MAVI</div>
    <p class="footer-text">Elevating everyday moments with subtle luxury and thoughtful design.</p>
    <div class="footer-copy">&copy; 2026 MAVI Jewelry. All rights reserved.</div>
  </footer>

  <div class="overlay" id="overlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Selection</h3>
      <button class="close-cart" id="closeCart">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">$0.00</span>
    </div>
    <button class="checkout-btn">Proceed to Checkout</button>
  </aside>

  <script src="script.js"></script>
</body>
</html>
